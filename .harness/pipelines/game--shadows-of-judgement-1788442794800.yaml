pipeline:
  identifier: Build_daviddc5_game__shadows_of_judgement_1788442912046
  name: Build game--shadows-of-judgement
  orgIdentifier: default
  projectIdentifier: shadowsofjudgement
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1788442749671
        repoName: daviddc5/game--shadows-of-judgement
  stages:
    - stage:
        identifier: build1
        name: build
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: installdependencies
                  name: install dependencies
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm install
                    privileged: false
                  timeout: ""
                  type: Run
              - step:
                  identifier: test
                  name: test
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm run test
                  timeout: ""
                  type: Run
              - step:
                  identifier: build
                  name: build
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm run build
                  timeout: ""
                  type: Run
              - step:
                  identifier: dockerbuild
                  name: docker_build
                  spec:
                    connectorRef: gameparpush
                    repo: europe-west1-docker.pkg.dev/shadowsofjudgement/cloud-run-source-deploy/shadows-of-judgment
                    tags:
                      - <+codebase.commitSha>
                    caching: true
                  timeout: ""
                  type: BuildAndPushDockerRegistry
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
        type: CI
        description: ""
    - stage:
        name: CD
        identifier: CD
        description: ""
        type: Deployment
        spec:
          deploymentType: GoogleCloudRun
          service:
            serviceRef: shadows_of_judgement
            serviceInputs:
              serviceDefinition:
                type: GoogleCloudRun
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: development
            deployToAll: false
            infrastructureDefinitions:
              - identifier: devcloudrun
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          # Install gcloud via apt
                          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | tee /etc/apt/sources.list.d/google-cloud-sdk.list
                          apt-get install -y apt-transport-https ca-certificates gnupg
                          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
                          apt-get update && apt-get install -y google-cloud-cli

                          # Authenticate
                          echo $GCP_KEY > /tmp/gcp-key.json
                          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json

                          # Deploy
                          gcloud run deploy shadows-of-judgment \
                            --image europe-west1-docker.pkg.dev/shadowsofjudgement/cloud-run-source-deploy/shadows-of-judgment:<+artifact.tag> \
                            --region europe-west1 \
                            --project shadowsofjudgement \
                            --allow-unauthenticated \
                            --platform managed

                          rm /tmp/gcp-key.json
                    environmentVariables:
                      - name: GCP_KEY
                        type: Secret
                        value: shadowsofjudgementkey
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
                  timeout: 10m
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
