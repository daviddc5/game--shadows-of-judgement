pipeline:
  identifier: Build_daviddc5_game__shadows_of_judgement_1788442912046
  name: Build game--shadows-of-judgement
  orgIdentifier: default
  projectIdentifier: shadowsofjudgement
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1788442749671
        repoName: daviddc5/game--shadows-of-judgement
  stages:
    - stage:
        identifier: build1
        name: build
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: installdependencies
                  name: install dependencies
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm install
                    privileged: false
                  timeout: ""
                  type: Run
              - step:
                  identifier: test
                  name: test
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm run test
                  timeout: ""
                  type: Run
              - step:
                  identifier: build
                  name: build
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm run build
                  timeout: ""
                  type: Run
              - step:
                  identifier: dockerbuild
                  name: docker_build
                  spec:
                    connectorRef: gameparpush
                    repo: europe-west1-docker.pkg.dev/shadowsofjudgement/cloud-run-source-deploy/shadows-of-judgment
                    tags:
                      - <+codebase.commitSha>
                    caching: true
                  timeout: ""
                  type: BuildAndPushDockerRegistry
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
        type: CI
        description: ""
    - stage:
        name: CD
        identifier: CD
        description: ""
        type: Deployment
        spec:
          deploymentType: GoogleCloudRun
          service:
            serviceRef: shadows_of_judgement
            serviceInputs:
              serviceDefinition:
                type: GoogleCloudRun
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: shadowsdocker
                      sources:
                        - identifier: shadowsdocker
                          type: GoogleArtifactRegistry
                          spec:
                            version: <+codebase.commitSha>
          environment:
            environmentRef: development
            deployToAll: false
            infrastructureDefinitions:
              - identifier: devcloudrun
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -euo pipefail
                          workdir=$(mktemp -d)
                          trap 'rm -rf "$workdir"' EXIT
                          export CLOUDSDK_CONFIG="$workdir/config"

                          if ! command -v gcloud >/dev/null 2>&1; then
                            curl -fsSL --retry 3 https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-558.0.0-linux-x86_64.tar.gz -o "$workdir/gcloud.tar.gz"
                            tar -xzf "$workdir/gcloud.tar.gz" -C "$workdir"
                            export PATH="$workdir/google-cloud-sdk/bin:$PATH"
                          fi

                          printf '%s' "$GCP_KEY" > "$workdir/key.json"
                          chmod 600 "$workdir/key.json"
                          gcloud auth activate-service-account --key-file="$workdir/key.json" --quiet

                          gcloud run deploy shadows-of-judgment \
                            --image europe-west1-docker.pkg.dev/shadowsofjudgement/cloud-run-source-deploy/shadows-of-judgment:<+codebase.commitSha> \
                            --region europe-west1 \
                            --project shadowsofjudgement \
                            --allow-unauthenticated \
                            --platform managed \
                            --quiet

                          gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.latestReadyRevisionName)' --quiet
                    environmentVariables:
                      - name: GCP_KEY
                        type: Secret
                        value: gcp-key-fresh
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
                  timeout: 10m
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
