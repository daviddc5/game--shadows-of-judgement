pipeline:
  identifier: Build_daviddc5_game__shadows_of_judgement_1788442912046
  name: Build game--shadows-of-judgement
  orgIdentifier: default
  projectIdentifier: shadowsofjudgement
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1788442749671
        repoName: daviddc5/game--shadows-of-judgement
  stages:
    - stage:
        identifier: build1
        name: build
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: installdependencies
                  name: install dependencies
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm install
                    privileged: false
                  timeout: ""
                  type: Run
              - step:
                  identifier: test
                  name: test
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm run test
                  timeout: ""
                  type: Run
              - step:
                  identifier: build
                  name: build
                  spec:
                    connectorRef: dockerhubpublic
                    image: node:20-bookworm
                    shell: Sh
                    command: npm run build
                  timeout: ""
                  type: Run
              - step:
                  identifier: dockerbuild
                  name: docker_build
                  spec:
                    connectorRef: gameparpush
                    repo: europe-west1-docker.pkg.dev/shadowsofjudgement/cloud-run-source-deploy/shadows-of-judgment
                    tags:
                      - <+codebase.commitSha>-<+pipeline.sequenceId>
                    buildArgs:
                      VITE_FME_CLIENT_KEY: <+secrets.getValue("fme_client_key")>
                    caching: true
                  timeout: ""
                  type: BuildAndPushDockerRegistry
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
        type: CI
        description: ""
    - stage:
        name: Approve production deployment
        identifier: Approve_production_deployment
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approval
                  identifier: approval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: "Approve deploying this build to the public Shadows of Judgment Cloud Run service."
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
                    approverInputs: []
                    isAutoRejectEnabled: false
        failureStrategies: []
        when:
          pipelineStatus: Success
          condition: >-
            <+pipeline.triggerType> == "WEBHOOK" &&
            <+trigger.event> == "PUSH" &&
            <+trigger.targetBranch> == "main"
    - stage:
        name: CD
        identifier: CD
        description: ""
        type: Deployment
        spec:
          deploymentType: GoogleCloudRun
          service:
            serviceRef: shadows_of_judgement
            serviceInputs:
              serviceDefinition:
                type: GoogleCloudRun
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: shadowsdocker
                      sources:
                        - identifier: shadowsdocker
                          type: GoogleArtifactRegistry
                          spec:
                            version: <+codebase.commitSha>-<+pipeline.sequenceId>
          environment:
            environmentRef: development
            deployToAll: false
            infrastructureDefinitions:
              - identifier: devcloudrun
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Record serving revision
                  identifier: Record_serving_revision
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -euo pipefail
                          workdir=$(mktemp -d)
                          trap 'rm -rf "$workdir"' EXIT
                          export CLOUDSDK_CONFIG="$workdir/config"

                          if ! command -v gcloud >/dev/null 2>&1; then
                            curl -fsSL --retry 3 https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-558.0.0-linux-x86_64.tar.gz -o "$workdir/gcloud.tar.gz"
                            tar -xzf "$workdir/gcloud.tar.gz" -C "$workdir"
                            export PATH="$workdir/google-cloud-sdk/bin:$PATH"
                          fi

                          printf '%s' "$GCP_KEY" > "$workdir/key.json"
                          chmod 600 "$workdir/key.json"
                          gcloud auth activate-service-account --key-file="$workdir/key.json" --quiet

                          previous_revision=$(gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.traffic[0].revisionName)' --quiet)
                          traffic_percent=$(gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.traffic[0].percent)' --quiet)
                          if [[ -z "$previous_revision" || "$traffic_percent" != "100" ]]; then
                            printf 'Expected one serving revision with 100%% traffic; got %s at %s%%\n' "$previous_revision" "$traffic_percent" >&2
                            exit 1
                          fi
                          printf 'Serving before deployment: %s\n' "$previous_revision"
                    environmentVariables:
                      - name: GCP_KEY
                        type: Secret
                        value: gcp-key-fresh
                    outputVariables:
                      - name: previous_revision
                        type: String
                        value: previous_revision
                    delegateSelectors:
                      - docker-delegate
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: ShellScript
                  name: Deploy and verify immutable image
                  identifier: Deploy_and_verify_immutable_image
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -euo pipefail
                          workdir=$(mktemp -d)
                          trap 'rm -rf "$workdir"' EXIT
                          export CLOUDSDK_CONFIG="$workdir/config"

                          if ! command -v gcloud >/dev/null 2>&1; then
                            curl -fsSL --retry 3 https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-558.0.0-linux-x86_64.tar.gz -o "$workdir/gcloud.tar.gz"
                            tar -xzf "$workdir/gcloud.tar.gz" -C "$workdir"
                            export PATH="$workdir/google-cloud-sdk/bin:$PATH"
                          fi

                          printf '%s' "$GCP_KEY" > "$workdir/key.json"
                          chmod 600 "$workdir/key.json"
                          gcloud auth activate-service-account --key-file="$workdir/key.json" --quiet

                          image_repo=europe-west1-docker.pkg.dev/shadowsofjudgement/cloud-run-source-deploy/shadows-of-judgment
                          image_tag='<+codebase.commitSha>-<+pipeline.sequenceId>'
                          image_uri="$image_repo:$image_tag"

                          gcloud run deploy shadows-of-judgment \
                            --image "$image_uri" \
                            --region europe-west1 \
                            --project shadowsofjudgement \
                            --allow-unauthenticated \
                            --platform managed \
                            --quiet

                          service_url=$(gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.url)' --quiet)
                          service_url=$(gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.url)' --quiet)
                          revision=$(gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.latestCreatedRevisionName)' --quiet)
                          expected_digest=$(gcloud artifacts docker images describe "$image_uri" --project shadowsofjudgement --format='value(image_summary.digest)')
                          deployed_digest=$(gcloud run revisions describe "$revision" --region europe-west1 --project shadowsofjudgement --format='value(status.imageDigest)' --quiet)
                          if [[ -z "$expected_digest" || -z "$deployed_digest" ]]; then
                            printf 'Could not resolve the expected or deployed image digest. Expected %s, got %s\n' "$expected_digest" "$deployed_digest" >&2
                            exit 1
                          fi
                          if [[ "$deployed_digest" != *"@$expected_digest" ]]; then
                            registry_host=${image_repo%%/*}
                            registry_path=${image_repo#*/}
                            registry_token=$(gcloud auth print-access-token)
                            printf 'header = "Authorization: Bearer %s"\n' "$registry_token" > "$workdir/registry-curl.conf"
                            chmod 600 "$workdir/registry-curl.conf"
                            unset registry_token
                            curl -fsSL --retry 3 --retry-delay 2 --max-time 20 \
                              --config "$workdir/registry-curl.conf" \
                              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                              --dump-header "$workdir/manifest.headers" \
                              --output "$workdir/image-manifest.json" \
                              "https://$registry_host/v2/$registry_path/manifests/$image_tag"
                            registry_digest=$(awk 'tolower($0) ~ /^docker-content-digest:/ { sub(/^[^:]*: */, ""); gsub(/\r/, ""); digest=$0 } END { print digest }' "$workdir/manifest.headers")
                            if [[ "$registry_digest" != "$expected_digest" ]]; then
                              printf 'Image tag resolved to %s during verification, expected %s\n' "$registry_digest" "$expected_digest" >&2
                              exit 1
                            fi
                            deployed_manifest_digest=${deployed_digest##*@}
                            if ! python3 - "$deployed_manifest_digest" "$workdir/image-manifest.json" <<'PY'
                          import json
                          import sys

                          deployed_digest = sys.argv[1]
                          with open(sys.argv[2], encoding="utf-8") as manifest_file:
                              manifest = json.load(manifest_file)

                          is_expected_platform_image = any(
                              entry.get("digest") == deployed_digest
                              and entry.get("platform", {}).get("os") == "linux"
                              and entry.get("platform", {}).get("architecture") == "amd64"
                              for entry in manifest.get("manifests", [])
                          )
                          sys.exit(0 if is_expected_platform_image else 1)
                          PY
                            then
                              printf 'Deployed digest %s is not the linux/amd64 image in expected index %s\n' "$deployed_digest" "$expected_digest" >&2
                              exit 1
                            fi
                          fi

                          if [[ -z "$FME_CLIENT_KEY" ]]; then
                            printf 'FME client key is not available to the deployment verification step\n' >&2
                            exit 1
                          fi
                          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 "$service_url/" -o "$workdir/index.html"
                          bundle_path=$(grep -oE 'src="[^"]+\.js"' "$workdir/index.html" | head -n 1 | cut -d '"' -f 2)
                          if [[ -z "$bundle_path" ]]; then
                            printf 'Could not find the game JavaScript bundle in the deployed HTML\n' >&2
                            exit 1
                          fi
                          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 "$service_url$bundle_path" -o "$workdir/game.js"
                          if ! grep -Fq "$FME_CLIENT_KEY" "$workdir/game.js" || ! grep -Fq 'test_mode_enabled' "$workdir/game.js"; then
                            printf 'The deployed game bundle is missing the feature flag SDK configuration\n' >&2
                            exit 1
                          fi
                          printf 'Verified revision %s serves image %s and contains the feature flag configuration\n' "$revision" "$deployed_digest"
                    environmentVariables:
                      - name: GCP_KEY
                        type: Secret
                        value: gcp-key-fresh
                      - name: FME_CLIENT_KEY
                        type: Secret
                        value: fme_client_key
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: ShellScript
                  name: Restore serving revision
                  identifier: Restore_serving_revision
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -euo pipefail
                          case "$PREVIOUS_REVISION" in
                            shadows-of-judgment-*) ;;
                            *) printf 'Missing or invalid prior revision\n' >&2; exit 1 ;;
                          esac

                          workdir=$(mktemp -d)
                          trap 'rm -rf "$workdir"' EXIT
                          export CLOUDSDK_CONFIG="$workdir/config"

                          if ! command -v gcloud >/dev/null 2>&1; then
                            curl -fsSL --retry 3 https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-558.0.0-linux-x86_64.tar.gz -o "$workdir/gcloud.tar.gz"
                            tar -xzf "$workdir/gcloud.tar.gz" -C "$workdir"
                            export PATH="$workdir/google-cloud-sdk/bin:$PATH"
                          fi

                          printf '%s' "$GCP_KEY" > "$workdir/key.json"
                          chmod 600 "$workdir/key.json"
                          gcloud auth activate-service-account --key-file="$workdir/key.json" --quiet

                          gcloud run services update-traffic shadows-of-judgment --region europe-west1 --project shadowsofjudgement --to-revisions "$PREVIOUS_REVISION=100" --quiet
                          restored_revision=$(gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.traffic[0].revisionName)' --quiet)
                          restored_percent=$(gcloud run services describe shadows-of-judgment --region europe-west1 --project shadowsofjudgement --format='value(status.traffic[0].percent)' --quiet)
                          if [[ "$restored_revision" != "$PREVIOUS_REVISION" || "$restored_percent" != "100" ]]; then
                            printf 'Rollback traffic verification failed: expected %s at 100%%, got %s at %s%%\n' "$PREVIOUS_REVISION" "$restored_revision" "$restored_percent" >&2
                            exit 1
                          fi
                          printf 'Restored 100%% of traffic to %s\n' "$PREVIOUS_REVISION"
                    environmentVariables:
                      - name: GCP_KEY
                        type: Secret
                        value: gcp-key-fresh
                      - name: PREVIOUS_REVISION
                        type: String
                        value: <+execution.steps.Record_serving_revision.output.outputVariables.previous_revision>
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        when:
          pipelineStatus: Success
          condition: >-
            <+pipeline.triggerType> == "WEBHOOK" &&
            <+trigger.event> == "PUSH" &&
            <+trigger.targetBranch> == "main"
