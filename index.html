<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows of Judgment</title>
    <style>
        /* Fill exactly the visible screen (dvh skips the hidden mobile address
           bar); Phaser fits and centres the game inside #game-container. The
           page colour is set to match the board theme in src/theme.js. */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        body {
            height: 100vh;
            height: 100dvh;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
